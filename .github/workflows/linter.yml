# This workflow will lint the entire codebase using the
# `super-linter/super-linter` action.
#
# For more information, see the super-linter repository:
#     https://github.com/super-linter/super-linter
name: Lint Codebase

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read
    packages: read
    statuses: write

jobs:
    lint:
        name: Lint Codebase
        runs-on: ubuntu-latest

        permissions:
            # contents permission to clone the repository
            contents: read
            packages: read
            # issues and pull-requests permissions to write results as pull
            # request comments. Omit them if you don't need summary comments
            issues: write
            pull-requests: write
            # To report GitHub Actions status checks. Omit if you don't need
            # to update commit status
            statuses: write

        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@v5
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install Dependencies
              id: install
              run: npm ci

            - name: Lint Codebase
              id: super-linter
              uses: super-linter/super-linter/slim@v8.6.0
              env:
                  DEFAULT_BRANCH: main
                  FILTER_REGEX_EXCLUDE: dist/**/*
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  LINTER_RULES_PATH: .
                  VALIDATE_ALL_CODEBASE: true
                  VALIDATE_BIOME_FORMAT: false
                  VALIDATE_BIOME_LINT: false
                  VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
                  VALIDATE_JAVASCRIPT_ES: false
                  VALIDATE_JSCPD: false
                  VALIDATE_JSON: false
                  VALIDATE_SPELL_CODESPELL: false
                  VALIDATE_TYPESCRIPT_ES: false
